name: Build and Deploy Product Management Application

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to build and deploy'
        required: true
        default: main
        type: choice
        options:
          - main
          - develop
          - features

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: Product-Management

      - name: Build application
        run: ./gradlew clean build --no-daemon
        working-directory: Product-Management

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-management-jar
          path: Product-Management/build/libs/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: product-management-jar
          path: artifact

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          debug: true
          script: |
            whoami
            hostname
            pwd

      - name: Create Deployment Directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /root/app

      - name: Copy JAR to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "artifact/*.jar"
          target: "/root/app"

      - name: Restart Spring Boot Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            mkdir -p /root/app
            cd /root/app

            pkill -f 'java -jar' || true
            sleep 5

            JAR_FILE=$(ls *.jar | head -1)

            echo "Starting application using $JAR_FILE"

            nohup java -jar "$JAR_FILE" > app.log 2>&1 &

            sleep 20

            echo "Java Processes:"
            ps -ef | grep java | grep -v grep

            echo "Application Logs:"
            tail -50 app.log