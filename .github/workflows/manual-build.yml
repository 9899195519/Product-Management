name: Manual Gradle Build
on:
  workflow_dispatch:
    inputs:
      gradleTask:
        description: 'Gradle task to run (e.g., build, test)'
        required: false
        default: 'build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build
        run: |
          cd Product-Management
          chmod +x gradlew
          ./gradlew clean build

      - name: Run Gradle task
        run: ./gradlew ${{ github.event.inputs.gradleTask }} --no-daemon
        env:
          CI: true

